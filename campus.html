<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/campus.css">
    <title>Campus - Academy Experience</title>
</head>
<body>

    <div class="dashboard">

        <!-- Encabezado y navegacion -->
        <header class="dashboard-header">
            <nav class="header-nav">
                <button class="menu-toggle" id="menu-toggle" aria-label="Abrir menú" aria-expanded="false" aria-controls="main-navigation">
                    <span></span>
                    <span></span>
                    <span></span>
                </button>
                <nav id="main-navigation" class="main-navigation" aria-label="Navegación principal">
                    <a href="index.html">Inicio</a>
                    <a href="campus.html" class="is-current" aria-current="page">Campus</a>
                    <a href="comunicacion.html">Comunicación</a>
                    <a href="gestion.html">Gestión Académica</a>
                    <a href="ayuda.html">Ayuda</a>
                </nav>
                <span class="user-avatar-dot"></span>
                <h1>CAMPUS</h1>
            </nav>
            <div class="search-bar">
                <input type="text" placeholder="Buscar...">
                <svg class="search-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/>
                    <line x1="21" y1="21" x2="16.65" y2="16.65" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                </svg>
            </div>
        </header>

        <!-- Contenido principal -->
        <main class="dashboard-main">

            <!-- Seccion de Usuario -->
            <section class="user-profile">
                <span class="user-profile-icon">
                    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <circle cx="12" cy="8" r="4" stroke="currentColor" stroke-width="1.8"/>
                        <path d="M4 20c0-4 3.6-6 8-6s8 2 8 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
                    </svg>
                </span>
                <p>DOUGLAS CRUZ</p>
            </section>

            <div class="campus-content">

                <!-- Seccion de Mapa -->
                <section class="map-section">
                    <h2>
                        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
                            <line x1="9" y1="4" x2="9" y2="18" stroke="currentColor" stroke-width="1.6"/>
                            <line x1="15" y1="6" x2="15" y2="20" stroke="currentColor" stroke-width="1.6"/>
                        </svg>
                        MAPA
                    </h2>

                    <div class="map-card">
                        <div class="map-placeholder"></div>

                        <div class="map-info">
                            <span class="map-info-item">
                                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                    <path d="M4 11 12 4l8 7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
                                    <path d="M6 10v9h12v-9" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
                                </svg>
                                EDIFICIO 4
                            </span>
                            <span class="map-info-item">
                                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                    <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.6"/>
                                    <polyline points="12 7 12 12 15 14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
                                </svg>
                                2 MINUTOS
                            </span>
                        </div>
                    </div>
                </section>

                <!-- Seccion de Ruta -->
                <section class="route-section">
                    <h2>
                        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M12 21s7-6.5 7-11.5A7 7 0 0 0 5 9.5C5 14.5 12 21 12 21Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
                            <circle cx="12" cy="9.5" r="2.3" stroke="currentColor" stroke-width="1.6"/>
                        </svg>
                        RUTA
                    </h2>

                    <div class="route-card">
                        <div class="route-field">
                            <label for="origen">ORIGEN</label>
                            <div class="route-input">
                                <input type="text" id="origen" placeholder="Escribe aquí...">
                                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                    <path d="M4 20 20 4M14 4h6v6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
                                </svg>
                            </div>
                        </div>

                        <div class="route-field">
                            <label for="destino">DESTINO</label>
                            <div class="route-input">
                                <input type="text" id="destino" placeholder="Escribe aquí...">
                                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                    <path d="M4 20 20 4M14 4h6v6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
                                </svg>
                            </div>
                        </div>
                    </div>

                    <button class="generate-route-button">
                        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
                            <line x1="9" y1="4" x2="9" y2="18" stroke="currentColor" stroke-width="1.6"/>
                            <line x1="15" y1="6" x2="15" y2="20" stroke="currentColor" stroke-width="1.6"/>
                        </svg>
                        GENERAR RUTA
                    </button>

                    <!-- El componente de alerta muestra un solo estado a la vez.
                         Por defecto se ve "ruta encontrada"; la clase .is-hidden
                         oculta el mensaje de error hasta que la lógica de búsqueda
                         (a futuro, con JS) decida cuál mostrar. -->
                    <div class="route-status-group" aria-live="polite">
                        <p class="route-status route-status--success">
                            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="1.6"/>
                                <polyline points="8 12.5 11 15.5 16 9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                            </svg>
                            RUTA ENCONTRADA
                        </p>

                        <p class="route-status route-status--warning is-hidden">
                            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <path d="M12 3 2 20h20L12 3Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
                                <line x1="12" y1="10" x2="12" y2="14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
                                <circle cx="12" cy="17" r="1" fill="currentColor"/>
                            </svg>
                            NO ENCONTRÓ LA RUTA
                        </p>
                    </div>
                </section>

            </div>

        </main>

        <!-- Pie de pagina -->
        <footer class="site-footer">
            <p>Hecho por Pablo Piedra y Douglas Cruz</p>
        </footer>

    </div>

    <script src="script.js"></script>
</body>
</html>
